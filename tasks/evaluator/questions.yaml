    question: "What is my current professional setup — company, main lines of work, and how do they relate to each other?"
    as_of: 2026-07-18
    gold_answer: >-
      Independent strategist-builder via Grafia Studió Bt. (ex-Head of Addressable
      Content EMEA, Wavemaker/WPP). Lines of work:
      (1) ERSTE — creative production across product categories (hitelkártya,
      személyi kölcsön, számlák, vállalkozók, market, ...). MessagingMatrix.ai is
      CORE infrastructure to this engagement, not a side product; it must be named
      in the ERSTE context.
      (2) Telekom — RMT/NGA ATL creatives and production, AI-assisted. eSignage is
      now only "RMT eContent", one part of the full eSignage project run by
      ArtFirst (media servers + physical screens); RMT eContent video approval flow
      is tracked in a spreadsheet, worked with Nagy Krisztián. AI advisory is tied
      directly to Telekom projects, not a standalone line.
      (3) Nexus — an active project not yet in Drive/Projects (should be added).
      Agaurg Ltd is paused. Attraction Productions is breaking down (invoicing
      problems) and should be flagged to close ASAP.
    required_claims:
      - "Grafia Studió Bt., independent, ex-Wavemaker/WPP"
      - "MessagingMatrix.ai is core infrastructure to ERSTE (not just a product)"
      - "eSignage = RMT eContent only; full eSignage run by ArtFirst"
      - "AI advisory is tied to Telekom, not standalone"
    forbidden_claims:
      - "Attraction Productions as a healthy/ongoing engagement"
      - "eSignage as Robert's full-scope deliverable"
    acceptable_unknowns: []
    required_sources: []
    freshness_sla: "quarterly review or on change"
