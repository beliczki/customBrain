&lt;script&gt;
  (() =&gt; {
    const root = document.getElementById(&#x27;professional-system-map&#x27;);
    const views = {
      current: {
        sources: [
          { id: &#x27;current-sources&#x27;, title: &#x27;Gmail · Fireflies · Calendar&#x27;, kind: &#x27;evidence&#x27;, body: &#x27;Real work evidence enters through mail, transcripts, and an all-purpose calendar.&#x27;, meta: &#x27;Risk: communication, scheduled intent, and completion are not the same thing.&#x27; },
          { id: &#x27;current-drive&#x27;, title: &#x27;Drive People + Projects&#x27;, kind: &#x27;evidence&#x27;, body: &#x27;Canonical names and full project prose are injected into metadata extraction.&#x27;, meta: &#x27;Observed: 252 People files, 217 under 100 bytes; project freshness is inconsistent.&#x27; },
          { id: &#x27;current-manual&#x27;, title: &#x27;Manual notes + references&#x27;, kind: &#x27;evidence&#x27;, body: &#x27;Deliberate notes and outside material share the same retrieval surface.&#x27;, meta: &#x27;A saved reference can rank beside a user-confirmed belief.&#x27; }
        ],
        representation: [
          { id: &#x27;current-flat&#x27;, title: &#x27;One flat thought shape&#x27;, kind: &#x27;memory&#x27;, body: &#x27;Events, beliefs, tasks, decisions, references, and identity are indexed as similarly shaped records.&#x27;, meta: &#x27;Root failure: the record type does not express authority or current validity.&#x27; },
          { id: &#x27;current-blobs&#x27;, title: &#x27;Thread and transcript blobs&#x27;, kind: &#x27;memory&#x27;, body: &#x27;Evolving email threads and meetings are summarized or stored as long text, then refreshed in place.&#x27;, meta: &#x27;Observed: 227 oversized active thoughts without the expected summary flag.&#x27; },
          { id: &#x27;current-time&#x27;, title: &#x27;One effective date&#x27;, kind: &#x27;memory&#x27;, body: &#x27;Content time improves recency, but there is no separate valid-from, valid-to, or reviewed-at state.&#x27;, meta: &#x27;History and current truth can be confused.&#x27; }
        ],
        answer: [
          { id: &#x27;current-search&#x27;, title: &#x27;Hybrid similarity + decay&#x27;, kind: &#x27;reasoning&#x27;, body: &#x27;Dense and lexical retrieval are strong primitives, but one ranking path serves every question type.&#x27;, meta: &#x27;Identity, current status, voice, and history require different truth rules.&#x27; },
          { id: &#x27;current-context&#x27;, title: &#x27;Large raw context&#x27;, kind: &#x27;reasoning&#x27;, body: &#x27;Top results may deliver whole summary-wrapped records to the answering model.&#x27;, meta: &#x27;Longer or newer evidence can dominate without being authoritative.&#x27; },
          { id: &#x27;current-answer&#x27;, title: &#x27;Plausible synthesis&#x27;, kind: &#x27;reasoning&#x27;, body: &#x27;The model must infer authority, freshness, endorsement, and conflicts from prose.&#x27;, meta: &#x27;Failure mode: fluent, coherent, unsupported certainty.&#x27; }
        ],
        control: [
          { id: &#x27;current-health&#x27;, title: &#x27;Health check&#x27;, kind: &#x27;governance&#x27;, body: &#x27;Duplicate candidates, over-tagging, long records, and registry anomalies are surfaced read-only.&#x27;, meta: &#x27;Useful structural audit; it does not say whether an answer is professionally true.&#x27; },
          { id: &#x27;current-proof&#x27;, title: &#x27;Retrieval prove-it harness&#x27;, kind: &#x27;governance&#x27;, body: &#x27;Existing gold annotations measure hit rate, latency, and payload size for a small fixed query set.&#x27;, meta: &#x27;Strong base to extend with evolving human-graded professional questions.&#x27; }
        ]
      },
      target: {
        sources: [
          { id: &#x27;target-sources&#x27;, title: &#x27;Source-specific evidence&#x27;, kind: &#x27;evidence&#x27;, body: &#x27;Mail proves communication, calendar proves scheduled intent, transcripts prove what was said, and references prove consumption.&#x27;, meta: &#x27;Each source has an explicit contract for what it can and cannot establish.&#x27; },
          { id: &#x27;target-boundary&#x27;, title: &#x27;Redaction + promotion boundary&#x27;, kind: &#x27;evidence&#x27;, body: &#x27;Secrets and irrelevant boilerplate are removed; only decisions, commitments, state changes, and exemplars are promoted.&#x27;, meta: &#x27;Raw availability is not automatic durable memory.&#x27; },
          { id: &#x27;target-log&#x27;, title: &#x27;Immutable evidence log&#x27;, kind: &#x27;evidence&#x27;, body: &#x27;Source pointers, authors, dates, and bounded excerpts remain available for verification.&#x27;, meta: &#x27;Evidence survives even when the current interpretation changes.&#x27; }
        ],
        representation: [
          { id: &#x27;target-canonical&#x27;, title: &#x27;Canonical entities&#x27;, kind: &#x27;memory&#x27;, body: &#x27;One self record, resolved people and projects, explicit statuses, aliases, review dates, and evidence links.&#x27;, meta: &#x27;Exact routing before semantic inference.&#x27; },
          { id: &#x27;target-long&#x27;, title: &#x27;Long-term professional model&#x27;, kind: &#x27;memory&#x27;, body: &#x27;Roles, capabilities, values, methods, constraints, relationships, and rejected paths are versioned claims.&#x27;, meta: &#x27;Stable memory does not decay like campaign status.&#x27; },
          { id: &#x27;target-short&#x27;, title: &#x27;Short-term working state&#x27;, kind: &#x27;memory&#x27;, body: &#x27;Active projects, decisions, commitments, risks, next milestones, and open questions carry valid-as-of dates.&#x27;, meta: &#x27;Stale state is labeled stale, not presented as current.&#x27; },
          { id: &#x27;target-response&#x27;, title: &#x27;Voice + management cases&#x27;, kind: &#x27;memory&#x27;, body: &#x27;Writing exemplars and decision cases are indexed by audience, intent, stakes, constraints, and outcome.&#x27;, meta: &#x27;There is no single averaged Robert style.&#x27; }
        ],
        answer: [
          { id: &#x27;target-router&#x27;, title: &#x27;Question router&#x27;, kind: &#x27;reasoning&#x27;, body: &#x27;Counts, current state, history, belief, voice, management, and synthesis take different retrieval paths.&#x27;, meta: &#x27;The task type determines the truth rules.&#x27; },
          { id: &#x27;target-packet&#x27;, title: &#x27;Bounded evidence packet&#x27;, kind: &#x27;reasoning&#x27;, body: &#x27;Canonical claims come first; exact lookup and matched chunks provide supporting evidence and conflicts.&#x27;, meta: &#x27;Small context, explicit provenance, no full blobs by default.&#x27; },
          { id: &#x27;target-contract&#x27;, title: &#x27;Answer contract&#x27;, kind: &#x27;reasoning&#x27;, body: &#x27;Every answer has an as-of date, supported claims, conflicts, unknowns, and context-conditioned voice.&#x27;, meta: &#x27;Confidence follows evidence coverage, not fluency.&#x27; }
        ],
        control: [
          { id: &#x27;target-evaluator&#x27;, title: &#x27;Evolving question bank&#x27;, kind: &#x27;governance&#x27;, body: &#x27;Versioned questions specify required claims, forbidden claims, freshness, and acceptable uncertainty.&#x27;, meta: &#x27;Robert reviews only 2–3 answers per batch.&#x27; },
          { id: &#x27;target-correction&#x27;, title: &#x27;Human correction loop&#x27;, kind: &#x27;governance&#x27;, body: &#x27;Ratings identify stale state, missing evidence, entity error, unsupported inference, voice mismatch, or management mismatch.&#x27;, meta: &#x27;Corrections update canonical truth only after confirmation.&#x27; },
          { id: &#x27;target-gate&#x27;, title: &#x27;Build gate&#x27;, kind: &#x27;governance&#x27;, body: &#x27;The largest measured failure class determines the next smallest change.&#x27;, meta: &#x27;No ranker, learning loop, or silent mutation until manual curation demonstrably hurts.&#x27; }
        ]
      }
    };

    const lanes = [&#x27;sources&#x27;, &#x27;representation&#x27;, &#x27;answer&#x27;, &#x27;control&#x27;];
    const controls = [...root.querySelectorAll(&#x27;[data-map-view]&#x27;)];
    const detailKind = root.querySelector(&#x27;[data-detail-kind]&#x27;);
    const detailTitle = root.querySelector(&#x27;[data-detail-title]&#x27;);
    const detailBody = root.querySelector(&#x27;[data-detail-body]&#x27;);
    const detailMeta = root.querySelector(&#x27;[data-detail-meta]&#x27;);

    const showDetail = (node, button) =&gt; {
      root.querySelectorAll(&#x27;.system-map__node&#x27;).forEach((item) =&gt; item.setAttribute(&#x27;aria-pressed&#x27;, &#x27;false&#x27;));
      if (button) button.setAttribute(&#x27;aria-pressed&#x27;, &#x27;true&#x27;);
      detailKind.textContent = node.kind.charAt(0).toUpperCase() + node.kind.slice(1);
      detailTitle.textContent = node.title;
      detailBody.textContent = node.body;
      detailMeta.textContent = node.meta;
    };

    const render = (viewName) =&gt; {
      const view = views[viewName];
      lanes.forEach((lane) =&gt; {
        const container = root.querySelector(`[data-map-lane=&quot;${lane}&quot;]`);
        container.replaceChildren();
        view[lane].forEach((node) =&gt; {
          const button = document.createElement(&#x27;button&#x27;);
          button.type = &#x27;button&#x27;;
          button.className = `btn viz-tile system-map__node system-map__node--${node.kind}`;
          button.textContent = node.title;
          button.setAttribute(&#x27;aria-pressed&#x27;, &#x27;false&#x27;);
          button.addEventListener(&#x27;click&#x27;, () =&gt; showDetail(node, button));
          container.appendChild(button);
        });
      });
      controls.forEach((button) =&gt; {
        const selected = button.dataset.mapView === viewName;
        button.classList.toggle(&#x27;btn-primary&#x27;, selected);
        button.setAttribute(&#x27;aria-pressed&#x27;, String(selected));
      });
      const first = view.sources[0];
      const firstButton = root.querySelector(&#x27;.system-map__node&#x27;);
      showDetail(first, firstButton);
    };

    controls.forEach((button) =&gt; button.addEventListener(&#x27;click&#x27;, () =&gt; render(button.dataset.mapView)));
    render(&#x27;current&#x27;);
  })();
